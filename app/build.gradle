plugins {
    id 'com.android.application'
}

// Release signing: read from keystore.properties (project root, git-ignored)
// or from ~/.android/opentuner/keystore.properties.
def keystoreProps = new Properties()
[rootProject.file('keystore.properties'), new File(System.getProperty('user.home'), '.android/opentuner/keystore.properties')]
        .find { it.exists() }?.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.opentuner.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.opentuner.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (keystoreProps.containsKey('storeFile')) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (keystoreProps.containsKey('storeFile')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
}
